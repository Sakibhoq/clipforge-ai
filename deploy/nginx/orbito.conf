# Nginx template (host-level nginx) for Orbito.
# Assumes docker-compose.prod.yml binds services to 127.0.0.1:3000 and 127.0.0.1:8000.

# ---- orbito.cc (frontend) ----
server {
    listen 80;
    server_name orbito.cc www.orbito.cc app.orbito.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name orbito.cc www.orbito.cc app.orbito.cc;

    # TLS certs (example paths; adjust for your cert manager)
    ssl_certificate     /etc/letsencrypt/live/orbito.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbito.cc/privkey.pem;

    # Security headers (basic)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ---- api.orbito.cc (backend) ----
server {
    listen 80;
    server_name api.orbito.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.orbito.cc;

    ssl_certificate     /etc/letsencrypt/live/api.orbito.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orbito.cc/privkey.pem;

    # If you ever use backend upload proxy endpoints, raise body limits:
    client_max_body_size 2G;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
}
