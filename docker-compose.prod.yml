services:
  frontend:
    build:
      context: ./frontend
      args:
        # Build-time: baked into Next.js bundle
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-https://api.orbito.cc}"
        NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
    # Bind locally so only your reverse proxy (nginx/caddy/ALB) can reach it.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: "production"
      # Runtime: also used by client helpers for fallbacks
      NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-https://api.orbito.cc}"
      NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    command: uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    environment:
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      LOCAL_STORAGE_PATH: "${LOCAL_STORAGE_PATH:-/data/storage}"
      LABS_FRONTEND_URL: "${LABS_FRONTEND_URL:-https://app.orbito.cc/app/labs}"
      LABS_API_URL: "${LABS_API_URL:-https://api.orbito.cc}"
      LABS_MODE: "${LABS_MODE:-external_bridge}"
      LABS_PHASE: "${LABS_PHASE:-foundation}"
      LABS_SHARE_USE_ORBITO_CONNECTIONS: "${LABS_SHARE_USE_ORBITO_CONNECTIONS:-1}"
      LABS_BRIDGE_SECRET: "${LABS_BRIDGE_SECRET:-}"
      LABS_ENTITLEMENTS_ALLOWED_ISSUERS: "${LABS_ENTITLEMENTS_ALLOWED_ISSUERS:-}"
      LABS_ENFORCE_PLAN_LOCK: "${LABS_ENFORCE_PLAN_LOCK:-1}"
      STRIPE_PRICE_LABS_SPARK_MONTHLY: "${STRIPE_PRICE_LABS_SPARK_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_VELOCITY_MONTHLY: "${STRIPE_PRICE_LABS_VELOCITY_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_VELOCITY_YEARLY: "${STRIPE_PRICE_LABS_VELOCITY_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"
      STRIPE_PRICE_LABS_STARTER_MONTHLY: "${STRIPE_PRICE_LABS_STARTER_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_CREATOR_MONTHLY: "${STRIPE_PRICE_LABS_CREATOR_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_CREATOR_YEARLY: "${STRIPE_PRICE_LABS_CREATOR_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"
    volumes:
      # Only used if you run sqlite/local storage in production.
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/ready', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      args:
        INSTALL_AI_DEPS: "${INSTALL_AI_DEPS:-1}"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      # Only used if you run sqlite/local storage in production.
      - ./data:/data
    environment:
      PYTHONFAULTHANDLER: "1"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      LOCAL_STORAGE_PATH: "${LOCAL_STORAGE_PATH:-/data/storage}"
      BACKEND_URL: "http://backend:8000"
      # Watermark defaults (override in .env.prod if needed)
      WORKER_WATERMARK_PNG: /app/assets/orbito-mark.png
      WORKER_WATERMARK_TEXT_FONTFILE: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      WORKER_WATERMARK_TEXT: "Orbito"
    restart: unless-stopped

  labs-frontend:
    build:
      context: ./clipforge-labs/frontend
      args:
        NEXT_PUBLIC_API_BASE: "${LABS_NEXT_PUBLIC_API_BASE:-/app/labs/lapi}"
        NEXT_PUBLIC_BASE_PATH: "${LABS_NEXT_PUBLIC_BASE_PATH:-/app/labs}"
        NEXT_BASE_PATH: "${LABS_NEXT_BASE_PATH:-/app/labs}"
        NEXT_PUBLIC_LABS_FORCE_PROXY_API: "1"
        NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
        INTERNAL_API_ORIGIN: "http://labs-backend:8000"
    ports:
      - "127.0.0.1:3100:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_BASE: "${LABS_NEXT_PUBLIC_API_BASE:-/app/labs/lapi}"
      NEXT_PUBLIC_BASE_PATH: "${LABS_NEXT_PUBLIC_BASE_PATH:-/app/labs}"
      NEXT_BASE_PATH: "${LABS_NEXT_BASE_PATH:-/app/labs}"
      NEXT_PUBLIC_LABS_FORCE_PROXY_API: "1"
      NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
      INTERNAL_API_ORIGIN: "http://labs-backend:8000"
      NEXT_PUBLIC_ORBITO_APP_ORIGIN: "${FRONTEND_BASE_URL:-https://app.orbito.cc}"
    depends_on:
      labs-backend:
        condition: service_healthy
    restart: unless-stopped

  labs-backend:
    build: ./clipforge-labs/backend
    command: uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8100:8000"
    env_file:
      - .env.prod
    environment:
      STORAGE_BACKEND: "${LABS_STORAGE_BACKEND:-local}"
      DATABASE_URL: "${LABS_DATABASE_URL:-sqlite:////data/labs/app.db}"
      AUTO_CREATE_DB: "${LABS_AUTO_CREATE_DB:-1}"
      FRONTEND_ORIGIN: "${LABS_FRONTEND_ORIGIN:-https://app.orbito.cc}"
      FRONTEND_BASE_URL: "${LABS_FRONTEND_BASE_URL:-https://app.orbito.cc/app/labs}"
      PUBLIC_API_BASE: "${LABS_PUBLIC_API_BASE:-https://app.orbito.cc/app/labs/lapi}"
      LOCAL_STORAGE_PATH: "${LABS_LOCAL_STORAGE_PATH:-/data/labs/storage}"
      LABS_USE_ORBITO_ENTITLEMENTS: "${LABS_USE_ORBITO_ENTITLEMENTS:-1}"
      LABS_USE_ORBITO_ENTITLEMENTS_STRICT: "${LABS_USE_ORBITO_ENTITLEMENTS_STRICT:-1}"
      ORBITO_API_BASE: "${ORBITO_API_BASE:-http://backend:8000}"
      LABS_ORBITO_API_BASE: "${LABS_ORBITO_API_BASE:-http://backend:8000}"
      LABS_BRIDGE_SECRET: "${LABS_BRIDGE_SECRET:-}"
      LABS_BRIDGE_TOKEN_SECRET: "${LABS_BRIDGE_TOKEN_SECRET:-}"
      EMAIL_FROM_NAME: "${LABS_EMAIL_FROM_NAME:-Orbito Labs}"
      EMAIL_FROM_EMAIL: "${LABS_EMAIL_FROM_EMAIL:-no-reply@orbito.cc}"
      EMAIL_REPLY_TO: "${LABS_EMAIL_REPLY_TO:-support@orbito.cc}"
      STRIPE_PRICE_LABS_SPARK_MONTHLY: "${STRIPE_PRICE_LABS_SPARK_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_VELOCITY_MONTHLY: "${STRIPE_PRICE_LABS_VELOCITY_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_VELOCITY_YEARLY: "${STRIPE_PRICE_LABS_VELOCITY_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"
      STRIPE_PRICE_LABS_STARTER_MONTHLY: "${STRIPE_PRICE_LABS_STARTER_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_CREATOR_MONTHLY: "${STRIPE_PRICE_LABS_CREATOR_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_CREATOR_YEARLY: "${STRIPE_PRICE_LABS_CREATOR_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/ready', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  labs-worker:
    build: ./clipforge-labs/worker
    depends_on:
      labs-backend:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - ./data:/data
    environment:
      PYTHONFAULTHANDLER: "1"
      STORAGE_BACKEND: "${LABS_STORAGE_BACKEND:-local}"
      LABS_DATABASE_URL: "${LABS_DATABASE_URL:-sqlite:////data/labs/app.db}"
      DATABASE_URL: "${LABS_DATABASE_URL:-sqlite:////data/labs/app.db}"
      LOCAL_STORAGE_PATH: "${LABS_LOCAL_STORAGE_PATH:-/data/labs/storage}"
      WORKER_BRAND_TEXT: "${LABS_WORKER_BRAND_TEXT:-Orbito Labs}"
      LABS_USE_ORBITO_ENTITLEMENTS: "${LABS_USE_ORBITO_ENTITLEMENTS:-1}"
      LABS_USE_ORBITO_ENTITLEMENTS_STRICT: "${LABS_USE_ORBITO_ENTITLEMENTS_STRICT:-1}"
      ORBITO_API_BASE: "${ORBITO_API_BASE:-http://backend:8000}"
      LABS_ORBITO_API_BASE: "${LABS_ORBITO_API_BASE:-http://backend:8000}"
      LABS_BRIDGE_SECRET: "${LABS_BRIDGE_SECRET:-}"
      LABS_BRIDGE_TOKEN_SECRET: "${LABS_BRIDGE_TOKEN_SECRET:-}"
      GOOGLE_VERTEX_PROJECT_ID: "${GOOGLE_VERTEX_PROJECT_ID:-}"
      GOOGLE_VERTEX_LOCATION: "${GOOGLE_VERTEX_LOCATION:-us-central1}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      GOOGLE_SERVICE_ACCOUNT_JSON: "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: "${GOOGLE_SERVICE_ACCOUNT_JSON_B64:-}"
      GOOGLE_AUTH_SCOPE: "${GOOGLE_AUTH_SCOPE:-https://www.googleapis.com/auth/cloud-platform}"
      LABS_GENERATION_PROVIDER: "${LABS_GENERATION_PROVIDER:-google}"
      LABS_GENERATION_STRICT: "${LABS_GENERATION_STRICT:-1}"
      LABS_ALLOW_DEMO_FALLBACK: "${LABS_ALLOW_DEMO_FALLBACK:-0}"
      LABS_ALLOW_PLACEHOLDER_POST_OUTPUT: "${LABS_ALLOW_PLACEHOLDER_POST_OUTPUT:-0}"
    restart: unless-stopped
