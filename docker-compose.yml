services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
        NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
    ports:
      - "3000:3000"
    environment:
      # IMPORTANT: browser-visible base
      NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
      NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


  backend:
    build: ./backend
    command: uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "8000:8000"
    volumes:
      # 🔑 MOUNT SOURCE CODE so edits apply immediately
      - ./backend:/app
      - ./data:/data

      # Shared credentials mount (AWS profiles / S3-compatible HMAC creds)
      - ${AWS_SHARED_CREDENTIALS_DIR:-/home/codespace/.aws}:/root/.aws:ro
    environment:
      # Core
      APP_ENV: "${APP_ENV:-development}"
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/app.db}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      PUBLIC_API_BASE: "${PUBLIC_API_BASE:-}"
      # Codespaces should not set cookie domain to a custom prod domain
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"


      # Stripe prices (set in .env for live mode)
      STRIPE_PRICE_FREE_MONTHLY: "${STRIPE_PRICE_FREE_MONTHLY:-}"
      STRIPE_PRICE_STARTER_MONTHLY: "${STRIPE_PRICE_STARTER_MONTHLY:-}"
      STRIPE_PRICE_STUDIO_MONTHLY: "${STRIPE_PRICE_STUDIO_MONTHLY:-}"
      STRIPE_PRICE_CREATOR_MONTHLY: "${STRIPE_PRICE_CREATOR_MONTHLY:-}"
      STRIPE_PRICE_CREATOR_YEARLY: "${STRIPE_PRICE_CREATOR_YEARLY:-}"
      STRIPE_PRICE_LABS_SPARK_MONTHLY: "${STRIPE_PRICE_LABS_SPARK_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_VELOCITY_MONTHLY: "${STRIPE_PRICE_LABS_VELOCITY_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_VELOCITY_YEARLY: "${STRIPE_PRICE_LABS_VELOCITY_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"
      STRIPE_PRICE_LABS_STARTER_MONTHLY: "${STRIPE_PRICE_LABS_STARTER_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_CREATOR_MONTHLY: "${STRIPE_PRICE_LABS_CREATOR_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_CREATOR_YEARLY: "${STRIPE_PRICE_LABS_CREATOR_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"

      # Storage
      STORAGE_BACKEND: "${LABS_STORAGE_BACKEND:-local}"
      LOCAL_STORAGE_PATH: "/data/storage"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-clipforge-uploads-dev-26}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-}"
      S3_SIGNATURE_VERSION: "${S3_SIGNATURE_VERSION:-s3v4}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      UPLOAD_PROXY_CHUNK_SIZE: "${UPLOAD_PROXY_CHUNK_SIZE:-524288}"
      STORAGE_REMOTE_FFPROBE_TIMEOUT_SEC: "${STORAGE_REMOTE_FFPROBE_TIMEOUT_SEC:-25}"
      STORAGE_FFPROBE_TIMEOUT_SEC: "${STORAGE_FFPROBE_TIMEOUT_SEC:-120}"

      # YouTube ingest + automations
      # Default OFF (enable explicitly when you want it)
      ENABLE_YOUTUBE_INGEST: "${ENABLE_YOUTUBE_INGEST:-0}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-/app/youtube_cookies.txt}"
      AUTOMATION_WEBHOOK_SECRET: "${AUTOMATION_WEBHOOK_SECRET:-}"
      AUTOPOST_PROVIDERS: "${AUTOPOST_PROVIDERS:-youtube,tiktok,instagram,facebook}"

      # URLs
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:3000}"
      LABS_FRONTEND_URL: "${LABS_FRONTEND_URL:-http://localhost:3100/app/labs}"
      LABS_API_URL: "${LABS_API_URL:-http://localhost:8100}"
      LABS_MODE: "${LABS_MODE:-external_bridge}"
      LABS_PHASE: "${LABS_PHASE:-foundation}"
      LABS_SHARE_USE_ORBITO_CONNECTIONS: "${LABS_SHARE_USE_ORBITO_CONNECTIONS:-1}"
      LABS_BRIDGE_SECRET: "${LABS_BRIDGE_SECRET:-}"
      LABS_ENTITLEMENTS_ALLOWED_ISSUERS: "${LABS_ENTITLEMENTS_ALLOWED_ISSUERS:-}"
      LABS_ENFORCE_PLAN_LOCK: "${LABS_ENFORCE_PLAN_LOCK:-1}"

      # OAuth (login + social connections)
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-}"
      OAUTH_YOUTUBE_CLIENT_ID: "${OAUTH_YOUTUBE_CLIENT_ID:-}"
      OAUTH_YOUTUBE_CLIENT_SECRET: "${OAUTH_YOUTUBE_CLIENT_SECRET:-}"
      OAUTH_ENABLED_PROVIDERS: "${OAUTH_ENABLED_PROVIDERS:-google}"
      OAUTH_TIKTOK_CLIENT_ID: "${OAUTH_TIKTOK_CLIENT_ID:-}"
      OAUTH_TIKTOK_CLIENT_SECRET: "${OAUTH_TIKTOK_CLIENT_SECRET:-}"
      OAUTH_FACEBOOK_CLIENT_ID: "${OAUTH_FACEBOOK_CLIENT_ID:-}"
      OAUTH_FACEBOOK_CLIENT_SECRET: "${OAUTH_FACEBOOK_CLIENT_SECRET:-}"
      OAUTH_FACEBOOK_CONFIG_ID: "${OAUTH_FACEBOOK_CONFIG_ID:-}"
      OAUTH_INSTAGRAM_CLIENT_ID: "${OAUTH_INSTAGRAM_CLIENT_ID:-}"
      OAUTH_INSTAGRAM_CLIENT_SECRET: "${OAUTH_INSTAGRAM_CLIENT_SECRET:-}"
      OAUTH_INSTAGRAM_CONFIG_ID: "${OAUTH_INSTAGRAM_CONFIG_ID:-}"
      OAUTH_META_REQUEST_PUBLISH_SCOPES: "${OAUTH_META_REQUEST_PUBLISH_SCOPES:-0}"
      TIKTOK_DEFAULT_PRIVACY: "${TIKTOK_DEFAULT_PRIVACY:-PUBLIC_TO_EVERYONE}"

      # Billing
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      # Contact email (SMTP)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-1}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-0}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-support@orbito.cc}"
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/ready', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  worker:
    build:
      context: ./worker
      args:
        INSTALL_AI_DEPS: "${INSTALL_AI_DEPS:-1}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ${AWS_SHARED_CREDENTIALS_DIR:-/home/codespace/.aws}:/root/.aws:ro
      - ./frontend/public:/app/public:ro
    environment:
      PYTHONFAULTHANDLER: "1"
      # Core
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/app.db}"
      WORKER_WATERMARK_PNG: /app/assets/orbito-mark.png
      WORKER_WATERMARK_TEXT_FONTFILE: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      WORKER_WATERMARK_TEXT: "Orbito"
      WORKER_CLIP_TARGET_SECONDS: "55"
      WORKER_CLIP_MAX_SECONDS: "65"
      WORKER_MIN_CLIPS_PER_MINUTE: "0.6"
      WORKER_TOP_K_CLIPS: "0"
      WORKER_MAX_TOP_K_CLIPS: "0"
      WORKER_MAX_RENDER_CLIPS_PER_JOB: "0"
      WORKER_ENABLE_FACE_FIRST: "0"
      WORKER_ADAPTIVE_CONTEXT_MODE: "0"
      WORKER_FORCE_CONTEXT_LAYOUT_WHEN_FACE_FIRST_OFF: "1"
      WORKER_REFRAME_SAMPLE_FPS: "3.0"
      WORKER_REFRAME_MAX_SAMPLE_FPS: "5.0"
      WORKER_REFRAME_MAX_KEYFRAMES_PER_CLIP: "48"
      WORKER_ADAPTIVE_CONTEXT_LAYOUT_MAX_KEYFRAMES: "36"
      WORKER_WHISPER_MODEL: "base"
      WORKER_CAPTION_CONTEXT_FONT_SCALE: "0.80"
      WORKER_CAPTION_CONTEXT_MARGIN_RATIO: "0.28"
      WORKER_WATERMARK_LOGO_W: "220"
      WORKER_WATERMARK_TEXT_SIZE: "70"

      # Storage
      STORAGE_BACKEND: "${LABS_STORAGE_BACKEND:-local}"
      # Local dev cookie domain disabled unless explicitly set
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      LOCAL_STORAGE_PATH: "/data/storage"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-clipforge-uploads-dev-26}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-}"
      S3_SIGNATURE_VERSION: "${S3_SIGNATURE_VERSION:-s3v4}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"

      # Timeouts
      WORKER_FFPROBE_TIMEOUT: "180"
      WORKER_SILENCEDETECT_MAX_SOURCE_SECONDS: "600"

      # Runtime
      BACKEND_URL: "http://backend:8000"
      AUTOMATION_WEBHOOK_SECRET: "${AUTOMATION_WEBHOOK_SECRET:-}"
    restart: unless-stopped


  labs-frontend:
    build:
      context: ./clipforge-labs/frontend
      args:
        NEXT_PUBLIC_API_BASE: "${LABS_NEXT_PUBLIC_API_BASE:-/app/labs/api}"
        NEXT_PUBLIC_BASE_PATH: "${LABS_NEXT_PUBLIC_BASE_PATH:-/app/labs}"
        NEXT_BASE_PATH: "${LABS_NEXT_BASE_PATH:-/app/labs}"
        NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
        INTERNAL_API_ORIGIN: "${LABS_INTERNAL_API_ORIGIN:-http://labs-backend:8000}"
    ports:
      - "3100:3000"
    environment:
      NEXT_PUBLIC_API_BASE: "${LABS_NEXT_PUBLIC_API_BASE:-/app/labs/api}"
      NEXT_PUBLIC_BASE_PATH: "${LABS_NEXT_PUBLIC_BASE_PATH:-/app/labs}"
      NEXT_BASE_PATH: "${LABS_NEXT_BASE_PATH:-/app/labs}"
      NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK: "${NEXT_PUBLIC_LABS_ENFORCE_PLAN_LOCK:-1}"
      INTERNAL_API_ORIGIN: "${LABS_INTERNAL_API_ORIGIN:-http://labs-backend:8000}"
      NEXT_PUBLIC_ORBITO_APP_ORIGIN: "${FRONTEND_BASE_URL:-http://localhost:3000}"
    depends_on:
      labs-backend:
        condition: service_healthy
    restart: unless-stopped


  labs-backend:
    build: ./clipforge-labs/backend
    command: uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "8100:8000"
    volumes:
      - ./clipforge-labs/backend:/app
      - ./data:/data
      - ${AWS_SHARED_CREDENTIALS_DIR:-/home/codespace/.aws}:/root/.aws:ro
    environment:
      APP_ENV: "${APP_ENV:-development}"
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "${LABS_DATABASE_URL:-sqlite:////data/labs/app.db}"
      FRONTEND_ORIGIN: "${LABS_FRONTEND_ORIGIN:-http://localhost:3100}"
      FRONTEND_BASE_URL: "${LABS_FRONTEND_BASE_URL:-http://localhost:3100/app/labs}"
      PUBLIC_API_BASE: "${LABS_PUBLIC_API_BASE:-http://localhost:8100}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"

      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      LOCAL_STORAGE_PATH: "${LABS_LOCAL_STORAGE_PATH:-/data/labs/storage}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-clipforge-uploads-dev-26}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-}"
      S3_SIGNATURE_VERSION: "${S3_SIGNATURE_VERSION:-s3v4}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"

      OAUTH_ENABLED_PROVIDERS: "${OAUTH_ENABLED_PROVIDERS:-google}"
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-}"
      OAUTH_TIKTOK_CLIENT_ID: "${OAUTH_TIKTOK_CLIENT_ID:-}"
      OAUTH_TIKTOK_CLIENT_SECRET: "${OAUTH_TIKTOK_CLIENT_SECRET:-}"
      OAUTH_FACEBOOK_CLIENT_ID: "${OAUTH_FACEBOOK_CLIENT_ID:-}"
      OAUTH_FACEBOOK_CLIENT_SECRET: "${OAUTH_FACEBOOK_CLIENT_SECRET:-}"
      OAUTH_FACEBOOK_CONFIG_ID: "${OAUTH_FACEBOOK_CONFIG_ID:-}"
      OAUTH_INSTAGRAM_CLIENT_ID: "${OAUTH_INSTAGRAM_CLIENT_ID:-}"
      OAUTH_INSTAGRAM_CLIENT_SECRET: "${OAUTH_INSTAGRAM_CLIENT_SECRET:-}"
      OAUTH_INSTAGRAM_CONFIG_ID: "${OAUTH_INSTAGRAM_CONFIG_ID:-}"
      OAUTH_META_REQUEST_PUBLISH_SCOPES: "${OAUTH_META_REQUEST_PUBLISH_SCOPES:-0}"
      TIKTOK_DEFAULT_PRIVACY: "${TIKTOK_DEFAULT_PRIVACY:-PUBLIC_TO_EVERYONE}"

      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-support@orbito.cc}"
      EMAIL_FROM_NAME: "${LABS_EMAIL_FROM_NAME:-Orbito Labs}"
      EMAIL_FROM_EMAIL: "${LABS_EMAIL_FROM_EMAIL:-no-reply@orbito.cc}"
      EMAIL_REPLY_TO: "${LABS_EMAIL_REPLY_TO:-support@orbito.cc}"
      STRIPE_PRICE_LABS_SPARK_MONTHLY: "${STRIPE_PRICE_LABS_SPARK_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_VELOCITY_MONTHLY: "${STRIPE_PRICE_LABS_VELOCITY_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_VELOCITY_YEARLY: "${STRIPE_PRICE_LABS_VELOCITY_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"
      STRIPE_PRICE_LABS_STARTER_MONTHLY: "${STRIPE_PRICE_LABS_STARTER_MONTHLY:-price_1T3lUiGJCQOlhEUMxmlPjwk9}"
      STRIPE_PRICE_LABS_CREATOR_MONTHLY: "${STRIPE_PRICE_LABS_CREATOR_MONTHLY:-price_1T3lVHGJCQOlhEUM8LY39wVp}"
      STRIPE_PRICE_LABS_CREATOR_YEARLY: "${STRIPE_PRICE_LABS_CREATOR_YEARLY:-price_1T3lViGJCQOlhEUMccBS7TXv}"

      LABS_USE_ORBITO_ENTITLEMENTS: "${LABS_USE_ORBITO_ENTITLEMENTS:-1}"
      LABS_USE_ORBITO_ENTITLEMENTS_STRICT: "${LABS_USE_ORBITO_ENTITLEMENTS_STRICT:-0}"
      ORBITO_API_BASE: "${ORBITO_API_BASE:-http://backend:8000}"
      LABS_ORBITO_API_BASE: "${LABS_ORBITO_API_BASE:-http://backend:8000}"
      LABS_BRIDGE_SECRET: "${LABS_BRIDGE_SECRET:-}"
      LABS_BRIDGE_TOKEN_SECRET: "${LABS_BRIDGE_TOKEN_SECRET:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/ready', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  labs-worker:
    build: ./clipforge-labs/worker
    depends_on:
      labs-backend:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ${AWS_SHARED_CREDENTIALS_DIR:-/home/codespace/.aws}:/root/.aws:ro
    environment:
      PYTHONFAULTHANDLER: "1"
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "${LABS_DATABASE_URL:-sqlite:////data/labs/app.db}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      LOCAL_STORAGE_PATH: "${LABS_LOCAL_STORAGE_PATH:-/data/labs/storage}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-clipforge-uploads-dev-26}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-}"
      S3_SIGNATURE_VERSION: "${S3_SIGNATURE_VERSION:-s3v4}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      WORKER_BRAND_TEXT: "${LABS_WORKER_BRAND_TEXT:-Orbito Labs}"

      LABS_USE_ORBITO_ENTITLEMENTS: "${LABS_USE_ORBITO_ENTITLEMENTS:-1}"
      LABS_USE_ORBITO_ENTITLEMENTS_STRICT: "${LABS_USE_ORBITO_ENTITLEMENTS_STRICT:-0}"
      ORBITO_API_BASE: "${ORBITO_API_BASE:-http://backend:8000}"
      LABS_ORBITO_API_BASE: "${LABS_ORBITO_API_BASE:-http://backend:8000}"
      LABS_BRIDGE_SECRET: "${LABS_BRIDGE_SECRET:-}"
      LABS_BRIDGE_TOKEN_SECRET: "${LABS_BRIDGE_TOKEN_SECRET:-}"
    restart: unless-stopped
