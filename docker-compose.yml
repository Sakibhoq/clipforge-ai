services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
    ports:
      - "3000:3000"
    environment:
      # IMPORTANT: browser-visible base
      NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


  backend:
    build: ./backend
    command: uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "8000:8000"
    volumes:
      # 🔑 MOUNT SOURCE CODE so edits apply immediately
      - ./backend:/app
      - ./data:/data

      # AWS credentials (Codespaces + local dev)
      - /home/codespace/.aws:/root/.aws:ro
    environment:
      # Core
      APP_ENV: "${APP_ENV:-development}"
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "sqlite:////data/app.db"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      PUBLIC_API_BASE: "${PUBLIC_API_BASE:-}"
      # Codespaces should not set cookie domain to a custom prod domain
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"


      # Stripe prices (set in .env for live mode)
      STRIPE_PRICE_FREE_MONTHLY: "${STRIPE_PRICE_FREE_MONTHLY:-}"
      STRIPE_PRICE_STARTER_MONTHLY: "${STRIPE_PRICE_STARTER_MONTHLY:-}"
      STRIPE_PRICE_STUDIO_MONTHLY: "${STRIPE_PRICE_STUDIO_MONTHLY:-}"
      STRIPE_PRICE_CREATOR_MONTHLY: "${STRIPE_PRICE_CREATOR_MONTHLY:-}"
      STRIPE_PRICE_CREATOR_YEARLY: "${STRIPE_PRICE_CREATOR_YEARLY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"

      # Storage
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      LOCAL_STORAGE_PATH: "/data/storage"
      AWS_REGION: "us-east-1"
      S3_BUCKET: "clipforge-uploads-dev-26"
      UPLOAD_PROXY_CHUNK_SIZE: "${UPLOAD_PROXY_CHUNK_SIZE:-524288}"
      STORAGE_REMOTE_FFPROBE_TIMEOUT_SEC: "${STORAGE_REMOTE_FFPROBE_TIMEOUT_SEC:-25}"
      STORAGE_FFPROBE_TIMEOUT_SEC: "${STORAGE_FFPROBE_TIMEOUT_SEC:-120}"

      # YouTube ingest + automations
      ENABLE_YOUTUBE_INGEST: "true"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-/app/youtube_cookies.txt}"
      AUTOMATION_WEBHOOK_SECRET: "${AUTOMATION_WEBHOOK_SECRET:-}"
      AUTOPOST_PROVIDERS: "${AUTOPOST_PROVIDERS:-youtube,tiktok,instagram,facebook}"

      # URLs
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:3000}"

      # OAuth (login + social connections)
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-}"
      OAUTH_YOUTUBE_CLIENT_ID: "${OAUTH_YOUTUBE_CLIENT_ID:-}"
      OAUTH_YOUTUBE_CLIENT_SECRET: "${OAUTH_YOUTUBE_CLIENT_SECRET:-}"
      OAUTH_ENABLED_PROVIDERS: "${OAUTH_ENABLED_PROVIDERS:-google}"
      OAUTH_TIKTOK_CLIENT_ID: "${OAUTH_TIKTOK_CLIENT_ID:-}"
      OAUTH_TIKTOK_CLIENT_SECRET: "${OAUTH_TIKTOK_CLIENT_SECRET:-}"
      OAUTH_FACEBOOK_CLIENT_ID: "${OAUTH_FACEBOOK_CLIENT_ID:-}"
      OAUTH_FACEBOOK_CLIENT_SECRET: "${OAUTH_FACEBOOK_CLIENT_SECRET:-}"
      OAUTH_FACEBOOK_CONFIG_ID: "${OAUTH_FACEBOOK_CONFIG_ID:-}"
      OAUTH_INSTAGRAM_CLIENT_ID: "${OAUTH_INSTAGRAM_CLIENT_ID:-}"
      OAUTH_INSTAGRAM_CLIENT_SECRET: "${OAUTH_INSTAGRAM_CLIENT_SECRET:-}"
      OAUTH_INSTAGRAM_CONFIG_ID: "${OAUTH_INSTAGRAM_CONFIG_ID:-}"
      OAUTH_META_REQUEST_PUBLISH_SCOPES: "${OAUTH_META_REQUEST_PUBLISH_SCOPES:-0}"
      TIKTOK_DEFAULT_PRIVACY: "${TIKTOK_DEFAULT_PRIVACY:-PUBLIC_TO_EVERYONE}"

      # Billing
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      # Contact email (SMTP)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-1}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-0}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-support@orbito.cc}"
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  worker:
    build:
      context: ./worker
      args:
        INSTALL_AI_DEPS: "${INSTALL_AI_DEPS:-1}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./backend:/backend
      - /home/codespace/.aws:/root/.aws:ro
      - ./frontend/public:/app/public:ro
    environment:
      PYTHONFAULTHANDLER: "1"
      # Core
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "sqlite:////data/app.db"
      WORKER_WATERMARK_PNG: /app/assets/orbito-mark.png
      WORKER_WATERMARK_TEXT_FONTFILE: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      WORKER_WATERMARK_TEXT: "Orbito"
      WORKER_CLIP_TARGET_SECONDS: "55"
      WORKER_CLIP_MAX_SECONDS: "65"
      WORKER_MIN_CLIPS_PER_MINUTE: "0.6"
      WORKER_TOP_K_CLIPS: "0"
      WORKER_MAX_TOP_K_CLIPS: "0"
      WORKER_MAX_RENDER_CLIPS_PER_JOB: "0"
      WORKER_ENABLE_FACE_FIRST: "0"
      WORKER_ADAPTIVE_CONTEXT_MODE: "0"
      WORKER_FORCE_CONTEXT_LAYOUT_WHEN_FACE_FIRST_OFF: "1"
      WORKER_REFRAME_SAMPLE_FPS: "3.0"
      WORKER_REFRAME_MAX_SAMPLE_FPS: "5.0"
      WORKER_REFRAME_MAX_KEYFRAMES_PER_CLIP: "48"
      WORKER_ADAPTIVE_CONTEXT_LAYOUT_MAX_KEYFRAMES: "36"
      WORKER_WHISPER_MODEL: "base"
      WORKER_CAPTION_CONTEXT_FONT_SCALE: "0.80"
      WORKER_CAPTION_CONTEXT_MARGIN_RATIO: "0.28"
      WORKER_WATERMARK_LOGO_W: "220"
      WORKER_WATERMARK_TEXT_SIZE: "70"

      # Storage
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      # Local dev cookie domain disabled unless explicitly set
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      LOCAL_STORAGE_PATH: "/data/storage"
      AWS_REGION: "us-east-1"
      S3_BUCKET: "clipforge-uploads-dev-26"

      # Timeouts
      WORKER_FFPROBE_TIMEOUT: "180"
      WORKER_SILENCEDETECT_MAX_SOURCE_SECONDS: "600"

      # Runtime
      PYTHONPATH: "/backend"
      BACKEND_URL: "http://backend:8000"
      AUTOMATION_WEBHOOK_SECRET: "${AUTOMATION_WEBHOOK_SECRET:-}"
    restart: unless-stopped
