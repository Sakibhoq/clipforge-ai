services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-https://api.clipforge.us}"
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
        NEXT_BASE_PATH: "${NEXT_BASE_PATH:-${NEXT_PUBLIC_BASE_PATH:-}}"
    ports:
      - "127.0.0.1:3100:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-https://api.clipforge.us}"
      NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
      NEXT_BASE_PATH: "${NEXT_BASE_PATH:-${NEXT_PUBLIC_BASE_PATH:-}}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    command: uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8100:8000"
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/app.db}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/ready', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      args:
        INSTALL_ALIGNMENT_DEPS: "${INSTALL_ALIGNMENT_DEPS:-0}"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - ./data:/data
    environment:
      PYTHONFAULTHANDLER: "1"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/app.db}"
      WORKER_BRAND_TEXT: "${WORKER_BRAND_TEXT:-Orbito Labs}"
    restart: unless-stopped
