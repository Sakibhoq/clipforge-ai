# Nginx template (host-level nginx) for Clipforge Labs.
# Assumes docker-compose.prod.yml binds services to 127.0.0.1:3100 and 127.0.0.1:8100.

# ---- clipforge.us (frontend) ----
server {
    listen 80;
    server_name clipforge.us www.clipforge.us app.clipforge.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clipforge.us www.clipforge.us app.clipforge.us;

    # TLS certs (example paths; adjust for your cert manager)
    ssl_certificate     /etc/letsencrypt/live/clipforge.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clipforge.us/privkey.pem;

    # Security headers (basic)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ---- api.clipforge.us (backend) ----
server {
    listen 80;
    server_name api.clipforge.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.clipforge.us;

    ssl_certificate     /etc/letsencrypt/live/api.clipforge.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.clipforge.us/privkey.pem;

    # If you ever use backend upload proxy endpoints, raise body limits:
    client_max_body_size 2G;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
}
