<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="52%" stop-color="#fb5607" />
      <stop offset="100%" stop-color="#3a86ff" />
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="48%" stop-color="#fb5607" />
      <stop offset="100%" stop-color="#3a86ff" />
    </linearGradient>
    <clipPath id="clipTop" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="256" />
    </clipPath>
    <clipPath id="clipBottom" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="256" width="512" height="256" />
    </clipPath>
    <filter id="ringGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="rotate(-18 256 256)" clip-path="url(#clipTop)" opacity="0.55">
    <ellipse
      cx="256"
      cy="270"
      rx="210"
      ry="82"
      fill="none"
      stroke="url(#ring)"
      stroke-width="40"
      stroke-linecap="round"
    />
  </g>

  <circle cx="256" cy="256" r="140" fill="url(#planet)" />

  <g transform="rotate(-18 256 256)" clip-path="url(#clipBottom)">
    <ellipse
      cx="256"
      cy="270"
      rx="210"
      ry="82"
      fill="none"
      stroke="url(#ring)"
      stroke-width="40"
      stroke-linecap="round"
      filter="url(#ringGlow)"
    />
  </g>
</svg>
